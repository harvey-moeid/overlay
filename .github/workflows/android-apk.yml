name: Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --no-daemon --console=plain
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BYGA-Smart-Overlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Dashboard preview (JVM SDK35)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-jvm-sdk35
          path: app/build/reports/ui/byga-home.png
          if-no-files-found: ignore

  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixture browser
        run: |
          npm install --prefix "$RUNNER_TEMP/byga-dom" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/byga-dom/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test browser adapter fixtures
        run: |
          export NODE_PATH="$RUNNER_TEMP/byga-dom/node_modules"
          export BYGA_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          node scripts/test-workflow-adapter.cjs
